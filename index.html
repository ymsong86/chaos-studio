<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>潮游 Chao's Studio — 小游戏总试玩主页（试玩版v1）</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f0f12;
    color: #f4f4f5;
    min-height: 100vh;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 56px;
  }
  .gate {
    max-width: 420px;
    margin: 64px auto;
    background: #18181d;
    border: 1px solid #2a2a33;
    border-radius: 20px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
  }
  .brand-tag {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 2px;
    color: #fb923c;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .gate h1 {
    margin: 0 0 10px;
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
  }
  .gate p {
    margin: 0 0 22px;
    font-size: 13px;
    color: #a1a1aa;
  }
  .gate-form {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .gate input {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid #3f3f46;
    background: #111115;
    color: #ffffff;
    font-size: 16px;
    text-align: center;
    letter-spacing: 4px;
    outline: none;
  }
  .gate input:focus {
    border-color: #f97316;
  }
  .gate button {
    padding: 11px 20px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #f97316, #ea580c);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .gate button:hover {
    opacity: 0.92;
  }
  .gate-err {
    margin-top: 12px;
    min-height: 18px;
    font-size: 13px;
    color: #f87171;
  }
  .catalog {
    display: none;
  }
  .top-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 22px;
    padding-bottom: 16px;
    border-bottom: 1px solid #27272a;
  }
  .top-bar h2 {
    margin: 0 0 4px;
    font-size: 22px;
    color: #ffffff;
  }
  .top-bar .sub {
    margin: 0;
    font-size: 13px;
    color: #a1a1aa;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
  }
  .search-input {
    padding: 9px 14px;
    border-radius: 10px;
    border: 1px solid #2e2e36;
    background: #18181d;
    color: #ffffff;
    font-size: 13px;
    min-width: 210px;
    outline: none;
  }
  .search-input:focus {
    border-color: #f97316;
  }
  .filter-btn {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid #2e2e36;
    background: #18181d;
    color: #d4d4d8;
    font-size: 12px;
    cursor: pointer;
  }
  .filter-btn.active {
    background: #ea580c;
    border-color: #ea580c;
    color: #ffffff;
    font-weight: 600;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
    gap: 20px;
  }
  .card {
    background: #18181d;
    border: 1px solid #2a2a33;
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.18s ease, border-color 0.18s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: #f97316;
  }
  .poster-box {
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #111115;
    overflow: hidden;
  }
  .poster-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-body {
    padding: 16px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .style-tag {
    font-size: 11px;
    color: #fb923c;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .card-title {
    margin: 0 0 8px;
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
  }
  .card-desc {
    margin: 0 0 16px;
    font-size: 13px;
    color: #a1a1aa;
    line-height: 1.5;
    flex: 1;
  }
  .play-btn {
    display: inline-block;
    text-align: center;
    padding: 10px 14px;
    border-radius: 10px;
    background: linear-gradient(135deg, #f97316, #ea580c);
    color: #ffffff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
  }
  .play-btn:hover {
    opacity: 0.92;
  }
</style>
</head>
<body>
<div class="wrap">
  <section id="gate" class="gate">
    <div class="brand-tag">潮游 Chao's Studio</div>
    <h1>小游戏总试玩主页</h1>
    <p>请输入访问密码解锁试玩中心</p>
    <form class="gate-form" onsubmit="handleUnlock(event)">
      <input id="pwdInput" type="password" autocomplete="off" placeholder="••••" required />
      <button type="submit">解锁</button>
    </form>
    <div id="gateErr" class="gate-err"></div>
  </section>

  <main id="catalog" class="catalog">
    <div class="top-bar">
      <div>
        <h2>潮游 Chao's Studio · 总试玩主页（试玩版v1）</h2>
        <p class="sub">持续更新小游戏试玩入口 · 随时扩展新作品</p>
      </div>
    </div>

    <div class="controls">
      <input id="searchInput" class="search-input" type="text" placeholder="搜索游戏名称或风格..." oninput="renderGames()" />
      <div id="filterBar" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;"></div>
    </div>

    <div id="gameGrid" class="grid"></div>
  </main>
</div>

<script>
  const ACCESS_CODE = "8888";

  const GAMES = [
    {
      title: "三国塔防：主公请留步（试玩版v1）",
      style: "方块潮玩风",
      desc: "守卫城池、排兵布阵迎战敌军，开启畅快塔防对战。",
      poster: "https://lh3.googleusercontent.com/d/1E6HaMpo1DcpDxGjJnfukehS57ZOQYspQ",
      url: "https://sites.google.com/view/chaos-sanguo-td"
    },
    {
      title: "MINI GTA罪恶都市：善与恶（试玩版v1）",
      style: "迈阿密电影写实风",
      desc: "迈阿密电影写实风都市冒险，体验善恶抉择与逆袭人生。",
      poster: "https://lh3.googleusercontent.com/d/1H2M6xmKk5R4Cj5yApTEit1XaHjzve2Lq",
      url: "https://sites.google.com/view/chaos-mini-gta"
    },
    {
      title: "快乐的摸鱼生活（试玩版v1）",
      style: "可爱唯美风",
      desc: "可爱唯美画风消除与摸鱼日常，轻松享受治愈时光。",
      poster: "https://lh3.googleusercontent.com/d/1Fi42xHJ0VtPaWW_WqCk8UVThU_IqHqg6",
      url: "https://sites.google.com/view/chaos-moyu-life"
    },
    {
      title: "文字西游：师父别怕（试玩版v1）",
      style: "水墨字画风",
      desc: "水墨字画风西游策略凑阵玩法，踏上别具一格的取经之路。",
      poster: "https://lh3.googleusercontent.com/d/1-ya_xtdYq2UI2dTRCEzWgTJRmGUa2-Id",
      url: "https://sites.google.com/view/chaos-xiyou-text"
    },
    {
      title: "重生1998：我要当首富（试玩版v1）",
      style: "年代逆袭商业风",
      desc: "回到1998抓住时代风口，白手起家步步逆袭成为首富。",
      poster: "https://lh3.googleusercontent.com/d/1-ya_xtdYq2UI2dTRCEzWgTJRmGUa2-Id",
      url: "https://sites.google.com/view/chaos-1998-tycoon"
    }
  ];

  let activeStyle = "全部";

  function handleUnlock(e) {
    e.preventDefault();
    const val = document.getElementById("pwdInput").value.trim();
    const errEl = document.getElementById("gateErr");
    if (val === ACCESS_CODE) {
      errEl.textContent = "";
      document.getElementById("gate").style.display = "none";
      document.getElementById("catalog").style.display = "block";
      buildFilters();
      renderGames();
    } else {
      errEl.textContent = "访问密码不正确，请重新输入";
    }
  }

  function buildFilters() {
    const styles = ["全部", ...new Set(GAMES.map(g => g.style))];
    const bar = document.getElementById("filterBar");
    bar.innerHTML = styles.map(st => `
      <button type="button" class="filter-btn ${st === activeStyle ? "active" : ""}" onclick="selectStyle('${st}')">${st}</button>
    `).join("");
  }

  function selectStyle(st) {
    activeStyle = st;
    buildFilters();
    renderGames();
  }

  function renderGames() {
    const kw = document.getElementById("searchInput").value.trim().toLowerCase();
    const list = GAMES.filter(g => {
      const matchStyle = activeStyle === "全部" || g.style === activeStyle;
      const matchKw = !kw || g.title.toLowerCase().includes(kw) || g.style.toLowerCase().includes(kw) || g.desc.toLowerCase().includes(kw);
      return matchStyle && matchKw;
    });

    const grid = document.getElementById("gameGrid");
    grid.innerHTML = list.map(g => `
      <article class="card">
        <div class="poster-box">
          <img src="${g.poster}" alt="${g.title}" loading="lazy" />
        </div>
        <div class="card-body">
          <div class="style-tag">${g.style}</div>
          <h3 class="card-title">${g.title}</h3>
          <p class="card-desc">${g.desc}</p>
          <a class="play-btn" href="${g.url}" target="_blank" rel="noopener noreferrer">开始试玩</a>
        </div>
      </article>
    `).join("");
  }
</script>
</body>
</html>
